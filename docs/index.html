<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HITS Hudson Sales Report</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#dfe2e8;--text:#14141a;--muted:#6d7080;--blue:#1769c2;--green:#168a4d;--red:#c93232;--amber:#b06c00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.head h1{margin:0;font-size:27px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.k{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700}.v{font-size:22px;font-weight:800;margin-top:5px}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}.panel h2{font-size:15px;margin:0;padding:13px 15px;border-bottom:1px solid var(--line)}.scroll{overflow:auto;max-height:72vh}table{border-collapse:collapse;width:100%;min-width:1500px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:right;font-size:12px;white-space:nowrap}th{position:sticky;top:0;background:#eef0f4;z-index:2;font-size:10px;text-transform:uppercase;color:var(--muted)}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}th:first-child{background:#eef0f4;z-index:3}input{width:90px;padding:5px;border:1px solid #d99a32;border-radius:5px;background:#fff7e7;text-align:right}.off{opacity:.55}.legend{padding:10px 15px;font-size:12px;color:var(--muted);line-height:1.5}.error{background:#fff0f0;border:1px solid #d44;color:#a00;padding:14px;border-radius:10px}.small{font-size:10px;color:var(--muted)}@media(max-width:700px){.wrap{padding:12px}.head{display:block}.grid{grid-template-columns:1fr 1fr}.v{font-size:18px}}
</style></head><body><div class="wrap"><div class="head"><div><h1>HITS Hudson Sales Report</h1><div class="muted">GitHub Pages · Shopify actuals · GOALS Sheet budgets</div></div><div id="generated" class="muted">Loading…</div></div><div id="app"></div></div>
<script>
const money=n=>'$'+Math.round(Number(n||0)).toLocaleString();const pct=n=>(Number(n||0)*100).toFixed(1)+'%';const key=(w,t)=>`hits_${w}_${t}`;
const saved=(w,t,d)=>localStorage.getItem(key(w,t))===null?Number(d||0):Number(localStorage.getItem(key(w,t))||0);
const setSaved=(w,t,v)=>{localStorage.setItem(key(w,t),String(Number(v||0)));render(window.DATA)};
const isOff=w=>localStorage.getItem(key(w.week,'off'))==='1';const setOff=(w,c)=>{c?localStorage.setItem(key(w,'off'),'1'):localStorage.removeItem(key(w,'off'));render(window.DATA)};
function card(k,v,d,c=''){return `<div class="card"><div class="k">${k}</div><div class="v ${c}">${v}</div><div class="small">${d}</div></div>`}
function render(data){window.DATA=data;document.getElementById('generated').textContent='Updated '+new Date(data.generated_at).toLocaleString();const a=data.assumptions;const capex=saved(0,'capex',a.capex);const defaultOpex=saved(0,'opex_default',a.opex);let actualOnly=-capex,forecast=-capex,budget=-capex;let actualPayback='Not reached',forecastPayback='Not reached',budgetPayback='Not reached';let totalActual=0,totalGoal=0;
const rows=data.weeks.map((w,i)=>{const off=isOff(w);const started=new Date(w.startISO+'T00:00:00')<=new Date();const goal=Number(w.goal||0);const budgetNet=goal*(1-a.discountReturnRate);const budgetGp=budgetNet*a.grossMarginTarget;const budgetContribution=budgetGp+a.marketingBudget-defaultOpex;const marketing=saved(w.week,'marketing',0);const opex=saved(w.week,'opex',defaultOpex);const hasActual=Number(w.actual.total_orders||0)>0||Number(w.actual.gross_sales||0)>0;const actualContribution=Number(w.actual.gross_profit||0)+marketing-opex;if(!off){totalGoal+=goal;totalActual+=Number(w.actual.gross_sales||0);budget+=budgetContribution;if(budget>=0&&budgetPayback==='Not reached')budgetPayback='Week '+w.week;if(started||hasActual){actualOnly+=actualContribution;forecast+=actualContribution}else forecast+=budgetContribution;if(actualOnly>=0&&actualPayback==='Not reached')actualPayback='Week '+w.week;if(forecast>=0&&forecastPayback==='Not reached')forecastPayback='Week '+w.week}
const ach=goal?Number(w.actual.gross_sales||0)/goal:0;return `<tr class="${off?'off':''}"><td><b>Week ${w.week}</b><div class="small">${w.startISO} – ${w.endISO}</div><label class="small"><input style="width:auto" type="checkbox" ${off?'checked':''} onchange="setOff(${w.week},this.checked)"> Off Week</label></td><td>${money(goal)}</td><td>${money(w.actual.gross_sales)}</td><td class="${ach>=.9?'good':started?'bad':''}">${pct(ach)}</td><td>${money(budgetNet)}</td><td>${money(w.actual.net_sales)}</td><td>${money(budgetGp)}</td><td>${money(w.actual.gross_profit)}</td><td><input type="number" value="${marketing}" onchange="setSaved(${w.week},'marketing',this.value)"></td><td><input type="number" value="${opex}" onchange="setSaved(${w.week},'opex',this.value)"></td><td class="${actualContribution>=0?'good':'bad'}">${money(actualContribution)}</td><td class="${budget>=0?'good':'bad'}">${money(budget)}</td><td class="${actualOnly>=0?'good':'bad'}">${money(actualOnly)}</td><td class="${forecast>=0?'good':'bad'}">${money(forecast)}</td><td>${w.actual.total_orders||0}</td></tr>`}).join('');
const gap=totalActual-totalGoal;document.getElementById('app').innerHTML=`<div class="grid">${card('12-week goal',money(totalGoal),'GOALS Sheet')}${card('Shopify actual gross sales',money(totalActual),'Corro Trailer 1 OR HitsHudson',gap>=0?'good':'bad')}${card('Sales gap / over',money(gap),'Actual minus goal',gap>=0?'good':'bad')}${card('Budget payback',budgetPayback,'Budget contribution only')}${card('Actual-only payback',actualPayback,'Only completed/started actual weeks',actualPayback==='Not reached'?'warn':'good')}${card('Actual + forecast payback',forecastPayback,'Actual started weeks + budget future weeks',forecastPayback==='Not reached'?'warn':'good')}</div><div class="panel"><h2>Editable assumptions</h2><div class="legend">CAPEX <input type="number" value="${capex}" onchange="setSaved(0,'capex',this.value)"> &nbsp; Default weekly OPEX <input type="number" value="${defaultOpex}" onchange="setSaved(0,'opex_default',this.value)"><br><b>Correct cumulative cash rule:</b> started weeks use Shopify Gross Profit + actual marketing − actual OPEX; future weeks use the budget contribution. Therefore the forecast payback updates automatically when Shopify actuals change.</div></div><div class="panel"><h2>12-Week Cumulative Cash and Payback</h2><div class="scroll"><table><thead><tr><th>Week</th><th>Sheet Goal</th><th>Actual Gross Sales</th><th>Achievement</th><th>Budget Net Sales</th><th>Actual Net Sales</th><th>Budget Gross Profit</th><th>Actual Gross Profit</th><th>Marketing Actual</th><th>OPEX Actual</th><th>Actual Contribution</th><th>Budget Cum. Cash</th><th>Actual-only Cum. Cash</th><th>Actual/Forecast Cum. Cash</th><th>Orders</th></tr></thead><tbody>${rows}</tbody></table></div><div class="legend">Budget cumulative cash never uses Shopify actuals. Actual-only cumulative cash uses only started weeks. Actual/forecast cumulative cash replaces each started week budget with its real contribution and keeps budget contribution only for future weeks.</div></div>`}
fetch('./report-data.json?ts='+Date.now()).then(r=>{if(!r.ok)throw new Error('report-data.json HTTP '+r.status);return r.json()}).then(render).catch(e=>document.getElementById('app').innerHTML='<div class="error">'+e.message+'</div>');
</script></body></html>
