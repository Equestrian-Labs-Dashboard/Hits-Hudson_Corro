name: Update HITS Hudson report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/index.html"
      - "package*.json"
      - ".github/workflows/update-report.yml"

permissions:
  contents: write

concurrency:
  group: hits-hudson-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Generate report-data.json
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
          HITS_LOCATION_ID: ${{ vars.HITS_LOCATION_ID }}
          HITS_LOCATION_NAME: ${{ vars.HITS_LOCATION_NAME }}
          HITS_ORDER_TAG: ${{ vars.HITS_ORDER_TAG }}
          GOALS_SPREADSHEET_ID: ${{ vars.GOALS_SPREADSHEET_ID }}
          GOALS_SHEET_NAME: ${{ vars.GOALS_SHEET_NAME }}
          PROJECT_WEEKS: ${{ vars.PROJECT_WEEKS }}
          PROJECT_START_DATE: ${{ vars.PROJECT_START_DATE }}
        run: npm run generate
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- docs/report-data.json; then
            echo "No report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report-data.json
          git commit -m "chore: refresh HITS Hudson report"
          git push
